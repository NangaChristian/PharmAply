name: DPML Alerts Sync Cron Job

on:
  schedule:
    # Exécution tous les jours à 01:00 UTC (02:00 heure de Douala, GMT+1)
    - cron: '0 1 * * *'
  workflow_dispatch: # Permet de déclencher le script manuellement depuis GitHub en cas d'urgence

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios cheerio @supabase/supabase-js

      - name: Run DPML Sync Node.js Script
        run: node scripts/sync-dpml.js
        env:
          # Injection des variables depuis les secrets GitHub
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
